<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venus Logistics Platform</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #0e1117;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            background-color: #0e1117;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        iframe.loaded {
            opacity: 1;
        }
    </style>
</head>
<body>
    <iframe
        src="https://venuslogisticsplatform.streamlit.app/?embed=true&embed_options=disable_scrolling"
        onload="this.classList.add('loaded')">
    </iframe>
</body>
</html>
